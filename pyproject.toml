[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sea-bank-tools"
version = "0.1.0"
description = "Deterministic fictional banking tools for the Memory Harness hackathon"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[tool.setuptools.packages.find]
include = ["bank_tools*"]

[tool.setuptools.package-data]
bank_tools = ["fixtures/*.yaml"]
