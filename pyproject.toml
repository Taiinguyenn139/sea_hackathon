[project]
name = "memory-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.9",
    "httpx>=0.27",
    "PyYAML>=6",
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=2",
    "phonenumbers>=9.0.42",
]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13", "types-PyYAML"]
[tool.pytest.ini_options]
testpaths = ["tests", "tests_eval"]
pythonpath = ["."]
[tool.ruff]
line-length = 120
[tool.mypy]
ignore_missing_imports = true
